<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>前日確認</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
--ink:       #1c1c1c;
--ink-sub:   #6e6e6e;
--surface:   #ffffff;
--bg:        #f0f0ef;
--line:      #dcdcdc;
--accent:    #333333;
--accent-dk: #000000;
--ok:        #2ec4b6;
--ng:        #e63946;
--radius:    10px;
}

html, body {
background: var(--bg);
color: var(--ink);
font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
font-size: 14px;
min-height: 100vh;
-webkit-tap-highlight-color: transparent;
}

main { padding: 10px 8px 28px; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

.login-badge {
background: var(--surface);
border: 1px solid var(--line);
border-radius: 8px;
padding: 7px 11px;
display: flex;
align-items: center;
gap: 6px;
font-size: 12px;
font-weight: 600;
color: var(--ink-sub);
}

/* ---- 共通アコーディオン(details) : 翌日入力用 ---- */
details.acc {
background: var(--surface);
border-radius: var(--radius);
border: 0.5px solid var(--line);
overflow: hidden;
}
details.acc summary {
list-style: none;
cursor: pointer;
padding: 10px 12px;
font-size: 12.5px;
font-weight: 700;
letter-spacing: .03em;
color: var(--ink);
display: flex;
align-items: center;
justify-content: space-between;
user-select: none;
background: var(--bg);
}
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::after {
content: '▾';
font-size: 11px;
color: var(--ink-sub);
transition: transform .15s;
}
details.acc[open] summary::after { transform: rotate(180deg); }
.acc-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }

/* ---- 日ブロック(当日/翌日 表示エリア) ---- */
.day-block { display: flex; flex-direction: column; gap: 5px; }
.day-heading-row {
display: flex; align-items: center; justify-content: space-between; gap: 6px;
padding: 0 2px;
}
.day-heading-text {
font-size: 12px; font-weight: 700; color: var(--ink);
display: flex; align-items: center; gap: 5px;
white-space: nowrap;
}
.day-heading-text .tag {
font-size: 10px; font-weight: 700; padding: 1px 6px;
border-radius: 20px; background: var(--line); color: var(--ink-sub);
}
.day-block.tomorrow .day-heading-text .tag { background: var(--ink); color: #fff; }

.tab-controls { display: flex; align-items: center; gap: 4px; }
.tab-btn {
font-size: 11px; font-weight: 700; padding: 4px 10px;
border-radius: 20px; border: 1px solid var(--line);
background: var(--surface); color: var(--ink-sub);
cursor: pointer; transition: all .12s;
}
.tab-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
.toggle-all-btn {
font-size: 13px; padding: 3px 6px; border-radius: 8px;
border: 1px solid var(--line); background: var(--surface);
cursor: pointer; line-height: 1;
}

.acc-panel { display: none; background: var(--surface); border: 0.5px solid var(--line); border-radius: 8px; padding: 8px 9px; }
.acc-panel.open { display: flex; flex-direction: column; gap: 6px; }

/* ---- レコードカード ---- */
.rec-card {
background: var(--bg);
border-radius: 7px;
padding: 8px 9px;
border: 0.5px solid var(--line);
}
.rec-card .rec-name {
font-size: 12.5px; font-weight: 700; color: var(--ink);
margin-bottom: 4px;
display: flex; align-items: center; justify-content: space-between;
gap: 8px;
}
.status-badge {
font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 20px;
white-space: nowrap;
}
.status-ok    { background: #e1f8f5; color: var(--ok); }
.status-wait  { background: #eaeaea; color: var(--ink-sub); }
.status-alert { background: #fdeaea; color: var(--ng); }
.rec-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 2px 8px;
font-size: 11px;
color: var(--ink-sub);
}
.rec-grid .k { font-weight: 600; color: var(--ink-sub); }
.rec-grid .v { color: var(--ink); font-weight: 600; }
.rec-empty {
font-size: 12px; color: var(--ink-sub);
text-align: center; padding: 10px 0;
}

/* ---- フォーム(翌日入力) ---- */
.card-title {
font-size: 10.5px; font-weight: 700;
letter-spacing: .08em; text-transform: uppercase;
color: var(--ink-sub); margin: 4px 0 2px;
}
.field { margin-bottom: 8px; }
.field:last-child { margin-bottom: 0; }
label {
display: block; font-size: 12px; font-weight: 600;
color: var(--ink-sub); margin-bottom: 4px;
}
label .req { color: var(--ng); margin-left: 2px; }
.inline-label { display: flex; align-items: baseline; gap: 5px; margin-bottom: 4px; }
.inline-label .main-lbl { font-size: 12px; font-weight: 600; color: var(--ink-sub); white-space: nowrap; }
.inline-label .sub-lbl { font-size: 10.5px; color: var(--ink-sub); line-height: 1.3; }

input[type="time"], input[type="text"] {
width: 100%; padding: 9px 10px;
border: 1.2px solid var(--line); border-radius: 7px;
font-size: 14px; font-family: inherit; color: var(--ink);
background: var(--surface); appearance: none; -webkit-appearance: none;
transition: border-color .15s; outline: none;
}
input:focus { border-color: var(--accent); }

.section-divider { border: none; border-top: 1px solid var(--line); margin: 8px 0; }

.radio-group { display: flex; gap: 6px; }
.radio-btn { flex: 1; position: relative; }
.radio-btn input { position: absolute; opacity: 0; width: 0; height: 0; }
.radio-btn label {
display: flex; align-items: center; justify-content: center;
padding: 8px 4px; border: 1.2px solid var(--line); border-radius: 7px;
font-size: 12px; font-weight: 600; color: var(--ink-sub);
cursor: pointer; transition: all .15s; margin: 0; background: var(--surface);
}
.radio-btn input:checked + label { border-color: var(--ink); background: var(--ink); color: #fff; }

.cond-field { display: none; margin-top: 8px; }
.cond-field.visible { display: block; }

.field-error { font-size: 10.5px; color: var(--ng); margin-top: 3px; display: none; }
.field-error.visible { display: block; }
input.has-error { border-color: var(--ng); }

#globalError {
display: none; background: #fdeaea; border: 1.2px solid var(--ng); border-radius: 7px;
padding: 8px 10px; font-size: 12px; color: var(--ng); font-weight: 600; margin-bottom: 8px;
}
#globalError.visible { display: block; }

#toast {
display: none; background: #eef7f6; border: 1.2px solid var(--ok); border-radius: 7px;
padding: 7px 10px; font-size: 11px; color: #1a8f83; font-weight: 700; margin-bottom: 8px;
text-align: center;
}
#toast.visible { display: block; }

#submitBtn {
width: 100%; padding: 11px; background: var(--accent); color: #fff;
border: none; border-radius: 7px; font-size: 13px; font-weight: 700;
font-family: inherit; letter-spacing: .03em; cursor: pointer;
transition: background .15s, opacity .15s; margin-top: 2px;
}
#submitBtn:active { background: var(--accent-dk); }
#submitBtn:disabled { opacity: .5; cursor: not-allowed; }

#loadingScreen {
position: fixed; inset: 0; background: var(--bg);
display: flex; align-items: center; justify-content: center;
z-index: 100; flex-direction: column; gap: 14px;
}
#loadingScreen.hidden { display: none; }
.spinner {
width: 32px; height: 32px;
border: 3px solid var(--line); border-top-color: var(--accent);
border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--ink-sub); }
</style>
</head>
<body>

<div id="loadingScreen">
<div class="spinner"></div>
<div class="loading-text">読み込み中…</div>
</div>

<main>
<div class="login-badge">
<span>👤</span>
<span id="loginName">読み込み中…</span>
</div>

<!-- ===== 翌日 入力・編集(ログイン直下) ===== -->
<details class="acc" id="tomorrowInputAcc" open>
<summary>✨ <span id="tomorrowInputDateLabel">--/--</span> 入力・編集</summary>
<div class="acc-body">
<div id="toast">送信しました！</div>
<div id="globalError">入力に不備があります。確認してください。</div>

<div class="field">
<label for="workPlace">勤務場所<span class="req">*</span></label>
<input type="text" id="workPlace" placeholder="例）ららぽーと甲子園 / 〇〇現場" required>
<div class="field-error" id="err-workPlace">勤務場所を入力してください</div>
</div>

<hr class="section-divider">

<div class="field">
<div class="inline-label">
<span class="main-lbl">出発時間<span class="req">*</span></span>
<span class="sub-lbl">自宅を出発する時間</span>
</div>
<input type="time" id="departureTime" required>
<div class="field-error" id="err-departureTime">入力してください</div>
</div>

<div class="field">
<label>移動区分<span class="req">*</span></label>
<div class="radio-group">
<div class="radio-btn">
<input type="radio" name="transportType" id="tr-train" value="電車">
<label for="tr-train">🚃 電車</label>
</div>
<div class="radio-btn">
<input type="radio" name="transportType" id="tr-pick" value="ピック">
<label for="tr-pick">🚗 ピック</label>
</div>
<div class="radio-btn">
<input type="radio" name="transportType" id="tr-none" value="なし">
<label for="tr-none">— なし</label>
</div>
</div>
<div class="field-error" id="err-transportType">移動区分を選択してください</div>

<div class="cond-field" id="cond-train">
<label for="transportTime">電車出発時間</label>
<input type="time" id="transportTime">
</div>

<div class="cond-field" id="cond-pick">
<label for="transportTimePick">集合時間</label>
<input type="time" id="transportTimePick">
<label for="pickupPlace" style="margin-top:8px">ピック場所</label>
<input type="text" id="pickupPlace" placeholder="例）大阪駅桜橋口">
</div>
</div>

<div class="field">
<div class="inline-label">
<span class="main-lbl">到着時間<span class="req">*</span></span>
<span class="sub-lbl">現場集合場所への到着予定時間</span>
</div>
<input type="time" id="arrivalTime" required>
<div class="field-error" id="err-arrivalTime">入力してください</div>
</div>

<button id="submitBtn" type="button">送信する</button>
</div>
</details>

<!-- ===== 当日ブロック(表示のみ) ===== -->
<div class="day-block" id="blockToday">
<div class="day-heading-row">
<span class="day-heading-text"><span id="todayDateLabel">--/--</span> 勤務分<span class="tag">当日</span></span>
<div class="tab-controls">
<button class="tab-btn active" data-panel="selfTodayPanel">自分</button>
<button class="tab-btn" data-panel="othersTodayPanel">他人</button>
<button class="toggle-all-btn" data-group="today" title="全開閉">🔃</button>
</div>
</div>
<div class="acc-panel open" id="selfTodayPanel">
<div id="selfTodayBody"><div class="rec-empty">読み込み中…</div></div>
</div>
<div class="acc-panel" id="othersTodayPanel">
<div id="othersTodayBody"><div class="rec-empty">読み込み中…</div></div>
</div>
</div>

<!-- ===== 翌日ブロック(表示のみ) ===== -->
<div class="day-block tomorrow" id="blockTomorrow">
<div class="day-heading-row">
<span class="day-heading-text">✨ <span id="tomorrowDateLabel">--/--</span> 勤務分<span class="tag">翌日</span></span>
<div class="tab-controls">
<button class="tab-btn active" data-panel="selfTomorrowPanel">自分</button>
<button class="tab-btn" data-panel="othersTomorrowPanel">他人</button>
<button class="toggle-all-btn" data-group="tomorrow" title="全開閉">🔃</button>
</div>
</div>
<div class="acc-panel open" id="selfTomorrowPanel">
<div id="selfTomorrowBody"><div class="rec-empty">読み込み中…</div></div>
</div>
<div class="acc-panel" id="othersTomorrowPanel">
<div id="othersTomorrowBody"><div class="rec-empty">読み込み中…</div></div>
</div>
</div>

</main>

<script>
const LIFF_ID = '2010311386-sSwMJRkO';
const GAS_URL = 'https://script.google.com/macros/s/AKfycby526aLBiPtUEuNll856wQvCI_GTnjlZO8RU8n4ffM7Q7vffa3T8hT0xrWYlAmbKNF1WQ/exec';

let lineUserId  = '';
let displayName = '';
let isSubmitting = false;
let tomorrowWorkDate = '';

const $ = id => document.getElementById(id);
const loadingScreen = $('loadingScreen');
const submitBtn     = $('submitBtn');
const globalError   = $('globalError');
const toast         = $('toast');

(async () => {
try {
await liff.init({ liffId: LIFF_ID });
if (!liff.isLoggedIn()) { liff.login(); return; }
const profile = await liff.getProfile();
lineUserId  = profile.userId;
displayName = profile.displayName;
} catch(e) {
console.error('LIFF init error:', e);
lineUserId  = 'debug_user';
displayName = 'デバッグユーザー';
}
$('loginName').textContent = displayName + ' としてログイン中';

const tomorrow = new Date();
tomorrow.setDate(tomorrow.getDate() + 1);
tomorrowWorkDate = tomorrow.toISOString().slice(0, 10);

setupTabControls();
await loadView();
loadingScreen.classList.add('hidden');
})();

// ---- タブ / 全開閉ボタンの初期化 ----
function setupTabControls() {
document.querySelectorAll('.tab-btn').forEach(btn => {
btn.addEventListener('click', () => {
const panel = $(btn.dataset.panel);
const willOpen = !panel.classList.contains('open');
panel.classList.toggle('open', willOpen);
btn.classList.toggle('active', willOpen);
});
});
document.querySelectorAll('.toggle-all-btn').forEach(btn => {
btn.addEventListener('click', () => {
const group = btn.dataset.group; // 'today' or 'tomorrow'
const panels = document.querySelectorAll(`#block${group === 'today' ? 'Today' : 'Tomorrow'} .acc-panel`);
const tabs   = document.querySelectorAll(`#block${group === 'today' ? 'Today' : 'Tomorrow'} .tab-btn`);
const allOpen = Array.from(panels).every(p => p.classList.contains('open'));
panels.forEach(p => p.classList.toggle('open', !allOpen));
tabs.forEach(t => t.classList.toggle('active', !allOpen));
});
});
}

// ---- データ取得＆描画 ----
async function loadView() {
try {
const res  = await fetch(`${GAS_URL}?mode=view&uid=${encodeURIComponent(lineUserId)}`);
const data = await res.json();
if (data.status !== 'ok') {
console.error('view取得エラー', data);
return;
}

$('todayDateLabel').textContent = fmtDateLabel(data.today.date);
$('tomorrowDateLabel').textContent = fmtDateLabel(data.tomorrow.date);
$('tomorrowInputDateLabel').textContent = fmtDateLabel(data.tomorrow.date);

renderSelf('selfTodayBody', data.today.self);
renderOthers('othersTodayBody', data.today.others);
renderSelf('selfTomorrowBody', data.tomorrow.self);
renderOthers('othersTomorrowBody', data.tomorrow.others);

prefillTomorrowForm(data.tomorrow.self);
} catch(err) {
console.error('loadViewエラー', err);
}
}

function fmtDateLabel(dateStr) {
if (!dateStr) return '--/--';
const d = new Date(dateStr + 'T00:00:00+09:00');
const w = ['日','月','火','水','木','金','土'][d.getDay()];
return `${d.getMonth()+1}/${d.getDate()}(${w})`;
}

function statusClass(disp) {
if (!disp) return 'status-wait';
if (disp.indexOf('出発済') >= 0) return 'status-ok';
if (disp.indexOf('要確認') >= 0) return 'status-alert';
return 'status-wait';
}

function transportLabel(r) {
if (r.transport === '電車') return `🚃 電車${r.transportTime ? '（'+r.transportTime+'）' : ''}`;
if (r.transport === 'ピック') return `🚗 ピック${r.pickup ? '（'+r.pickup+'）' : ''}`;
return '— なし';
}

function recordCardHtml(r, opts) {
opts = opts || {};
const badge = (typeof r.dispStatus !== 'undefined')
? `<span class="status-badge ${statusClass(r.dispStatus)}">${r.dispStatus}</span>`
: '';
return `
<div class="rec-card">
<div class="rec-name"><span>${opts.showName === false ? (r.event || '') : (r.name || '')}</span>${badge}</div>
<div class="rec-grid">
${opts.showName === false ? '' : `<span class="k">施策名</span><span class="v">${r.event || '-'}</span>`}
<span class="k">集合時間</span><span class="v">${r.meetTime || '-'}</span>
<span class="k">出発予定</span><span class="v">${r.departTime || '-'}</span>
<span class="k">到着予定</span><span class="v">${r.arriveTime || '-'}</span>
<span class="k">移動区分</span><span class="v">${transportLabel(r)}</span>
</div>
</div>`;
}

function renderSelf(bodyId, self) {
$(bodyId).innerHTML = self
? recordCardHtml(self, { showName: false })
: '<div class="rec-empty">データがありません</div>';
}

function renderOthers(bodyId, others) {
const body = $(bodyId);
if (!others || others.length === 0) {
body.innerHTML = '<div class="rec-empty">他のスタッフの情報はありません</div>';
} else {
body.innerHTML = others.map(r => recordCardHtml(r)).join('');
}
}

// ---- 翌日・入力フォームへ既存データを反映(既に送信済みならそれを表示) ----
function prefillTomorrowForm(self) {
if (!self) return;
$('workPlace').value = self.event || '';
$('departureTime').value = self.departTime || '';
$('arrivalTime').value = self.arriveTime || '';

if (self.transport === '電車') {
$('tr-train').checked = true;
$('transportTime').value = self.transportTime || '';
} else if (self.transport === 'ピック') {
$('tr-pick').checked = true;
$('transportTimePick').value = self.transportTime || '';
$('pickupPlace').value = self.pickup || '';
} else if (self.transport === 'なし') {
$('tr-none').checked = true;
}
updateCondFields();
}

// ---- フォーム制御 ----
document.querySelectorAll('input[name="transportType"]').forEach(r => {
r.addEventListener('change', updateCondFields);
});

function updateCondFields() {
const val = getTransportType();
$('cond-train').classList.toggle('visible', val === '電車');
if (val !== '電車') $('transportTime').value = '';
$('cond-pick').classList.toggle('visible', val === 'ピック');
if (val !== 'ピック') {
$('transportTimePick').value = '';
$('pickupPlace').value = '';
}
}

function getTransportType() {
const c = document.querySelector('input[name="transportType"]:checked');
return c ? c.value : '';
}

function getTransportTime() {
const val = getTransportType();
if (val === '電車')   return $('transportTime').value || '';
if (val === 'ピック') return $('transportTimePick').value || '';
return '';
}

function validate() {
let ok = true;
[
{ id: 'workPlace',     errId: 'err-workPlace',     check: v => v.trim() !== '' },
{ id: 'departureTime', errId: 'err-departureTime', check: v => v !== '' },
{ id: 'arrivalTime',   errId: 'err-arrivalTime',   check: v => v !== '' },
].forEach(({ id, errId, check }) => {
const el = $(id), err = $(errId);
const pass = check(el.value);
el.classList.toggle('has-error', !pass);
err.classList.toggle('visible', !pass);
if (!pass) ok = false;
});
const noTr = !getTransportType();
$('err-transportType').classList.toggle('visible', noTr);
if (noTr) ok = false;
return ok;
}

submitBtn.addEventListener('click', async () => {
if (isSubmitting) return;
globalError.classList.remove('visible');
toast.classList.remove('visible');

if (!validate()) {
globalError.classList.add('visible');
return;
}

isSubmitting = true;
submitBtn.disabled = true;
submitBtn.textContent = '送信中…';

const payload = {
timestamp:     new Date().toISOString(),
lineUserId:    lineUserId,
displayName:   displayName,
workDate:      tomorrowWorkDate,
workPlace:     $('workPlace').value.trim(),
departureTime: $('departureTime').value,
arrivalTime:   $('arrivalTime').value,
transportType: getTransportType(),
transportTime: getTransportTime(),
pickupPlace:   $('pickupPlace').value.trim() || '',
};

try {
await fetch(GAS_URL, {
method:   'POST',
redirect: 'follow',
headers:  { 'Content-Type': 'text/plain;charset=utf-8' },
body:     JSON.stringify(payload),
});
toast.classList.add('visible');
await loadView();
} catch(err) {
console.error(err);
globalError.textContent = '送信に失敗しました。再度お試しください。';
globalError.classList.add('visible');
} finally {
isSubmitting = false;
submitBtn.disabled = false;
submitBtn.textContent = '送信する';
}
});
</script>
</body>
</html>
